<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI News Daily — Pinda Lab</title>
<meta name="description" content="AI News Daily — arXiv・Hacker News・Reddit・GitHub・企業ブログから毎日自動収集">
<meta property="og:title" content="AI News Daily">
<meta property="og:description" content="AIニュース — 毎日自動更新">
<meta property="og:type" content="website">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:'Helvetica Neue',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px 80px}

.lang-switch{position:fixed;top:16px;right:16px;display:flex;gap:2px;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:3px;z-index:100}
.lang-btn{background:transparent;border:none;color:#7d8590;font-size:11px;font-weight:600;letter-spacing:.5px;padding:5px 10px;border-radius:5px;cursor:pointer;transition:background .15s,color .15s}
.lang-btn:hover{color:#e6edf3}
.lang-btn.active{background:#7c3aed;color:#fff}

header{text-align:center;margin-bottom:32px;width:100%;max-width:760px}
.logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:10px}
.logo-mark{width:36px;height:36px;background:linear-gradient(135deg,#7c3aed,#a855f7);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px}
.logo-text{font-size:24px;font-weight:800;letter-spacing:-.5px}
.logo-text span{color:#a855f7}
header p{color:#7d8590;font-size:13px;margin-bottom:8px}
.stats-bar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:12px;color:#7d8590}
.stats-bar .stat{display:flex;align-items:center;gap:4px}
.stats-bar .dot{width:8px;height:8px;border-radius:50%;display:inline-block}

.date-nav{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:24px;width:100%;max-width:760px}
.date-nav button{background:#161b22;border:1px solid #30363d;color:#e6edf3;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;transition:background .15s}
.date-nav button:hover{background:#21262d}
.date-nav button:disabled{opacity:.3;cursor:default}
.date-nav .date-label{font-size:15px;font-weight:600;min-width:140px;text-align:center}

.filter-bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:28px;width:100%;max-width:760px}
.filter-btn{background:#161b22;border:1px solid #30363d;color:#7d8590;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
.filter-btn:hover{color:#e6edf3;border-color:#484f58}
.filter-btn.active{background:#7c3aed;border-color:#7c3aed;color:#fff}

.feed{width:100%;max-width:760px;display:flex;flex-direction:column;gap:12px}

.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:16px 16px 16px 20px;border-left:3px solid #30363d;transition:border-color .15s,background .15s;cursor:pointer;text-decoration:none;color:inherit;display:block}
.card:hover{background:#1c2129;border-color:#484f58}
.card[data-source="arxiv"]{border-left-color:#b31b1b}
.card[data-source="hn"]{border-left-color:#ff6600}
.card[data-source="reddit"]{border-left-color:#0079d3}
.card[data-source="github"]{border-left-color:#e6edf3}
.card[data-source="blogs"]{border-left-color:#14b8a6}

.card-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.source-badge{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:2px 7px;border-radius:4px;color:#fff;flex-shrink:0}
.badge-arxiv{background:#b31b1b}
.badge-hn{background:#ff6600}
.badge-reddit{background:#0079d3}
.badge-github{background:#21262d;color:#e6edf3;border:1px solid #30363d}
.badge-blogs{background:#14b8a6}
.card-time{font-size:11px;color:#484f58;margin-left:auto;flex-shrink:0;white-space:nowrap}

.card-title{font-size:15px;font-weight:600;line-height:1.4;margin-bottom:6px}
.card-meta{font-size:12px;color:#7d8590;line-height:1.5}
.card-meta .tag{display:inline-block;background:#21262d;padding:1px 6px;border-radius:3px;margin:1px 2px;font-size:11px;color:#a855f7}
.card-meta .metric{margin-right:10px}
.card-abstract{font-size:13px;color:#7d8590;line-height:1.6;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-abstract.expanded{-webkit-line-clamp:unset}

.card-stars{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;color:#7d8590}
.card-stars svg{width:14px;height:14px;fill:#e3b341}
.stars-today{color:#3fb950;font-weight:600}

.empty-state{text-align:center;padding:60px 20px;color:#484f58;font-size:15px}

footer{margin-top:48px;text-align:center;color:#484f58;font-size:11px}
footer a{color:#7d8590;text-decoration:none}
footer a:hover{color:#a855f7}

.loading{text-align:center;padding:40px;color:#7d8590;font-size:14px}

.highlights-section{width:100%;max-width:760px;margin-bottom:32px}
.highlights-title{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:0 4px}
.highlights-title .icon{font-size:22px;filter:drop-shadow(0 0 8px rgba(168,85,247,.5))}
.highlights-title h2{font-size:18px;font-weight:800;background:linear-gradient(135deg,#a855f7,#fbbf24);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.highlights-grid{display:flex;flex-direction:column;gap:14px}

.highlight-card{background:linear-gradient(135deg,#1c1233 0%,#161b22 50%,#0d1117 100%);border:1px solid #7c3aed;border-radius:14px;padding:20px 22px;text-decoration:none;color:inherit;display:block;transition:transform .15s,border-color .15s,box-shadow .15s;position:relative;overflow:hidden}
.highlight-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#a855f7,#fbbf24,#a855f7)}
.highlight-card:hover{transform:translateY(-2px);border-color:#a855f7;box-shadow:0 8px 24px rgba(124,58,237,.25)}
.highlight-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.highlight-source{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:4px;color:#fff}
.highlight-rank{font-size:11px;color:#fbbf24;font-weight:700;letter-spacing:.5px}
.highlight-title{font-size:18px;font-weight:700;line-height:1.4;margin-bottom:10px;color:#e6edf3}
.highlight-title-en{font-size:12px;color:#7d8590;font-weight:400;margin-bottom:10px;line-height:1.4;font-style:italic}
.highlight-take{font-size:14px;color:#c9d1d9;line-height:1.7;border-left:3px solid #fbbf24;padding-left:12px;margin-top:10px}

.card-title-en{font-size:11px;color:#484f58;font-weight:400;margin-bottom:4px;line-height:1.3;font-style:italic}
.card-summary{font-size:13px;color:#a8b4c0;line-height:1.6;margin-top:6px}

@media(max-width:600px){
  body{padding:32px 10px 60px}
  .card{padding:12px 12px 12px 16px}
  .card-title{font-size:14px}
  .date-nav{gap:8px}
  .filter-bar{gap:4px}
  .filter-btn{padding:5px 10px;font-size:11px}
  .highlight-card{padding:16px 18px}
  .highlight-title{font-size:16px}
  .highlight-take{font-size:13px}
}
</style>
</head>
<body>

<div class="lang-switch">
  <button class="lang-btn active" data-lang="ja" onclick="setLang('ja')">JP</button>
  <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
</div>

<header>
  <div class="logo">
    <div class="logo-mark">📡</div>
    <div class="logo-text">AI News <span>Daily</span></div>
  </div>
  <p data-i18n="subtitle">AIニュース — 毎日自動更新</p>
  <div class="stats-bar" id="statsBar"></div>
</header>

<div class="date-nav" id="dateNav">
  <button id="prevDay" onclick="changeDay(-1)">← <span data-i18n="prev">前日</span></button>
  <div class="date-label" id="dateLabel"></div>
  <button id="nextDay" onclick="changeDay(1)"><span data-i18n="next">翌日</span> →</button>
</div>

<div class="highlights-section" id="highlightsSection" style="display:none">
  <div class="highlights-title">
    <span class="icon">✨</span>
    <h2 data-i18n="highlightsTitle">今日の見どころ</h2>
  </div>
  <div class="highlights-grid" id="highlightsGrid"></div>
</div>

<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" data-filter="all" onclick="setFilter('all')"><span data-i18n="filterAll">すべて</span></button>
  <button class="filter-btn" data-filter="arxiv" onclick="setFilter('arxiv')">arXiv</button>
  <button class="filter-btn" data-filter="hn" onclick="setFilter('hn')">Hacker News</button>
  <button class="filter-btn" data-filter="reddit" onclick="setFilter('reddit')">Reddit</button>
  <button class="filter-btn" data-filter="github" onclick="setFilter('github')">GitHub</button>
  <button class="filter-btn" data-filter="blogs" onclick="setFilter('blogs')"><span data-i18n="filterBlogs">ブログ</span></button>
</div>

<div class="feed" id="feed">
  <div class="loading" data-i18n="loading">読み込み中...</div>
</div>

<footer>
  <p id="lastUpdated"></p>
  <p style="margin-top:6px">
    <a href="https://pndshch.github.io/">Pinda Lab</a> ·
    <a href="https://github.com/pndshch/ai-news-daily">GitHub</a>
  </p>
</footer>

<script>
const I18N = {
  ja: {
    subtitle: "AIニュース — 毎日自動更新",
    prev: "前日", next: "翌日",
    filterAll: "すべて", filterBlogs: "ブログ",
    loading: "読み込み中...",
    empty: "この日のニュースはありません",
    updated: "最終更新",
    points: "pt", comments: "コメント",
    stars: "★", starsToday: "本日",
    authors: "著者", expand: "もっと見る",
    forks: "フォーク",
    highlightsTitle: "今日の見どころ",
  },
  en: {
    subtitle: "AI News — auto-updated daily",
    prev: "Prev", next: "Next",
    filterAll: "All", filterBlogs: "Blogs",
    loading: "Loading...",
    empty: "No news for this date",
    updated: "Last updated",
    points: "pts", comments: "comments",
    stars: "★", starsToday: "today",
    authors: "by", expand: "show more",
    forks: "forks",
    highlightsTitle: "Today's Highlights",
  }
};

let currentLang = localStorage.getItem("pl-lang") || "ja";
let currentFilter = "all";
let currentDate = null;
let newsData = null;

const NEWS_DATA = /* __NEWS_DATA__ */ null;

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem("pl-lang", lang);
  document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (I18N[lang][key]) el.textContent = I18N[lang][key];
  });
  if (newsData) render();
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.dataset.filter === f));
  render();
}

function formatDate(dateStr) {
  const d = new Date(dateStr + "T00:00:00Z");
  if (currentLang === "ja") {
    const days = ["日","月","火","水","木","金","土"];
    return `${d.getUTCFullYear()}年${d.getUTCMonth()+1}月${d.getUTCDate()}日（${days[d.getUTCDay()]}）`;
  }
  return d.toLocaleDateString("en-US", {weekday:"short", year:"numeric", month:"short", day:"numeric", timeZone:"UTC"});
}

function timeAgo(isoStr) {
  if (!isoStr) return "";
  const diff = (Date.now() - new Date(isoStr).getTime()) / 1000;
  if (diff < 3600) return Math.floor(diff / 60) + "m";
  if (diff < 86400) return Math.floor(diff / 3600) + "h";
  return Math.floor(diff / 86400) + "d";
}

function changeDay(delta) {
  const dates = getAvailableDates();
  const idx = dates.indexOf(currentDate);
  const newIdx = idx + delta;
  if (newIdx >= 0 && newIdx < dates.length) {
    currentDate = dates[newIdx];
    loadDate(currentDate);
  }
}

function getAvailableDates() {
  if (!NEWS_DATA) return [];
  if (typeof NEWS_DATA === "object" && NEWS_DATA.date) return [NEWS_DATA.date];
  if (Array.isArray(NEWS_DATA)) return NEWS_DATA.map(d => d.date).sort();
  return Object.keys(NEWS_DATA).sort();
}

function getDataForDate(dateStr) {
  if (!NEWS_DATA) return null;
  if (typeof NEWS_DATA === "object" && NEWS_DATA.date) return NEWS_DATA.date === dateStr ? NEWS_DATA : null;
  if (Array.isArray(NEWS_DATA)) return NEWS_DATA.find(d => d.date === dateStr) || null;
  return NEWS_DATA[dateStr] || null;
}

async function loadDate(dateStr) {
  currentDate = dateStr;
  newsData = getDataForDate(dateStr);

  if (!newsData) {
    try {
      const resp = await fetch(`data/${dateStr}.json`);
      if (resp.ok) newsData = await resp.json();
    } catch (e) { /* ignore */ }
  }

  updateDateNav();
  render();
}

function updateDateNav() {
  document.getElementById("dateLabel").textContent = currentDate ? formatDate(currentDate) : "—";
  const dates = getAvailableDates();
  const idx = dates.indexOf(currentDate);
  document.getElementById("prevDay").disabled = idx <= 0;
  document.getElementById("nextDay").disabled = idx >= dates.length - 1;
}

function pickTitle(p) {
  return (currentLang === "ja" && p.title_ja) ? p.title_ja : p.title;
}

function flatten(data) {
  if (!data || !data.sources) return [];
  const items = [];
  const s = data.sources;

  (s.arxiv || []).forEach(p => items.push({
    source: "arxiv", title: pickTitle(p), title_orig: p.title, url: p.url,
    time: p.published,
    meta: (p.authors || []).slice(0, 3).join(", ") + (p.authors && p.authors.length > 3 ? " et al." : ""),
    tags: p.categories || [],
    summary: (currentLang === "ja" && p.summary_ja) ? p.summary_ja : (p.abstract || ""),
    show_orig: currentLang === "ja" && p.title_ja && p.title_ja !== p.title,
  }));

  (s.hn || []).forEach(p => items.push({
    source: "hn", title: pickTitle(p), title_orig: p.title, url: p.url || p.comments_url,
    time: p.created_at,
    meta: `<span class="metric">${p.points} ${I18N[currentLang].points}</span><span class="metric">${p.comments} ${I18N[currentLang].comments}</span>`,
    summary: (currentLang === "ja" && p.summary_ja) ? p.summary_ja : "",
    show_orig: currentLang === "ja" && p.title_ja && p.title_ja !== p.title,
    tags: [],
  }));

  (s.reddit || []).forEach(p => items.push({
    source: "reddit", title: pickTitle(p), title_orig: p.title, url: p.url || p.comments_url,
    time: p.created_at,
    meta: `<span class="metric">↑${p.score}</span><span class="metric">${p.comments} ${I18N[currentLang].comments}</span><span class="tag">r/${p.subreddit}</span>`,
    summary: (currentLang === "ja" && p.summary_ja) ? p.summary_ja : "",
    show_orig: currentLang === "ja" && p.title_ja && p.title_ja !== p.title,
    tags: [],
  }));

  (s.github || []).forEach(p => items.push({
    source: "github", title: p.full_name || p.name, url: p.url,
    time: null,
    desc: (currentLang === "ja" && p.summary_ja) ? p.summary_ja : (p.description || ""),
    stars: p.stars, stars_today: p.stars_today, forks: p.forks, language: p.language,
    tags: [],
  }));

  (s.blogs || []).forEach(p => items.push({
    source: "blogs", title: pickTitle(p), title_orig: p.title, url: p.url,
    time: p.published,
    meta: `<span class="tag">${p.source}</span>`,
    summary: (currentLang === "ja" && p.summary_ja) ? p.summary_ja : (p.summary || ""),
    show_orig: currentLang === "ja" && p.title_ja && p.title_ja !== p.title,
    tags: [],
  }));

  return items;
}

function renderCard(item) {
  const badge = `<span class="source-badge badge-${item.source}">${item.source === "blogs" ? "BLOG" : item.source.toUpperCase()}</span>`;
  const time = item.time ? `<span class="card-time">${timeAgo(item.time)}</span>` : "";

  let body = `<div class="card-title">${escHtml(item.title)}</div>`;
  if (item.show_orig) body += `<div class="card-title-en">${escHtml(item.title_orig)}</div>`;

  if (item.summary) body += `<div class="card-summary">${escHtml(item.summary)}</div>`;
  if (item.meta) body += `<div class="card-meta">${item.meta}</div>`;
  if (item.tags && item.tags.length) body += `<div class="card-meta">${item.tags.map(t => `<span class="tag">${escHtml(t)}</span>`).join("")}</div>`;
  if (item.desc) body += `<div class="card-summary">${escHtml(item.desc)}</div>`;

  if (item.source === "github") {
    const lang = item.language ? `<span style="margin-right:8px">${escHtml(item.language)}</span>` : "";
    const todayBadge = item.stars_today ? `<span class="stars-today">+${item.stars_today} ${I18N[currentLang].starsToday}</span>` : "";
    body += `<div class="card-stars">${lang}<svg viewBox="0 0 16 16"><path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/></svg>${(item.stars||0).toLocaleString()} ${todayBadge}</div>`;
  }

  return `<a class="card" data-source="${item.source}" href="${escAttr(item.url)}" target="_blank" rel="noopener">`
    + `<div class="card-header">${badge}${time}</div>${body}</a>`;
}

function escHtml(s) {
  if (!s) return "";
  const d = document.createElement("div"); d.textContent = s; return d.innerHTML;
}
function escAttr(s) {
  return (s||"").replace(/"/g,"&quot;").replace(/</g,"&lt;");
}

function renderHighlight(h, idx) {
  const sourceLabel = {arxiv:"ARXIV",hn:"HN",reddit:"REDDIT",github:"GITHUB",blogs:"BLOG"}[h.source] || h.source.toUpperCase();
  const title = (currentLang === "ja" && h.title_ja) ? h.title_ja : h.title;
  const showOrig = currentLang === "ja" && h.title_ja && h.title_ja !== h.title;
  const take = (currentLang === "ja" && h.hot_take_ja) ? h.hot_take_ja : (h.hot_take || "");

  return `<a class="highlight-card" href="${escAttr(h.url)}" target="_blank" rel="noopener">`
    + `<div class="highlight-header">`
    + `<span class="highlight-source badge-${h.source}">${sourceLabel}</span>`
    + `<span class="highlight-rank">#${idx + 1}</span>`
    + `</div>`
    + `<div class="highlight-title">${escHtml(title)}</div>`
    + (showOrig ? `<div class="highlight-title-en">${escHtml(h.title)}</div>` : "")
    + (take ? `<div class="highlight-take">${escHtml(take)}</div>` : "")
    + `</a>`;
}

function renderHighlights(data) {
  const section = document.getElementById("highlightsSection");
  const grid = document.getElementById("highlightsGrid");
  const highlights = (data && data.highlights) || [];
  if (highlights.length === 0) {
    section.style.display = "none";
    return;
  }
  section.style.display = "block";
  grid.innerHTML = highlights.map(renderHighlight).join("");
}

function render() {
  const feed = document.getElementById("feed");
  if (!newsData) {
    feed.innerHTML = `<div class="empty-state">${I18N[currentLang].empty}</div>`;
    updateStats(null);
    renderHighlights(null);
    return;
  }

  renderHighlights(newsData);

  const items = flatten(newsData);
  const filtered = currentFilter === "all" ? items : items.filter(i => i.source === currentFilter);

  if (filtered.length === 0) {
    feed.innerHTML = `<div class="empty-state">${I18N[currentLang].empty}</div>`;
  } else {
    feed.innerHTML = filtered.map(renderCard).join("");
  }

  updateStats(newsData);
  const ts = newsData.generated_at;
  if (ts) document.getElementById("lastUpdated").textContent = `${I18N[currentLang].updated}: ${new Date(ts).toLocaleString()}`;
}

function updateStats(data) {
  const bar = document.getElementById("statsBar");
  if (!data || !data.stats) { bar.innerHTML = ""; return; }
  const s = data.stats;
  const colors = {arxiv:"#b31b1b",hn:"#ff6600",reddit:"#0079d3",github:"#e6edf3",blogs:"#14b8a6"};
  const labels = {arxiv:"arXiv",hn:"HN",reddit:"Reddit",github:"GitHub",blogs:"Blogs"};
  bar.innerHTML = Object.entries(labels).map(([k,l]) =>
    `<span class="stat"><span class="dot" style="background:${colors[k]}"></span>${l} ${s[k+"_count"]||0}</span>`
  ).join("");
}

(function init() {
  setLang(currentLang);
  if (NEWS_DATA) {
    const dates = getAvailableDates();
    loadDate(dates[dates.length - 1]);
  } else {
    document.getElementById("feed").innerHTML = `<div class="empty-state">${I18N[currentLang].empty}</div>`;
  }
})();
</script>
</body>
</html>
