<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Highlight — AI News Daily</title>
<meta name="description" content="AI News Daily highlight — detailed bilingual explanation">
<meta property="og:title" content="AI News Daily — Highlight">
<meta property="og:description" content="今日の見どころの詳細解説（日本語・英語）">
<meta property="og:type" content="article">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:'Helvetica Neue',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px 80px}

.lang-switch{position:fixed;top:16px;right:16px;display:flex;gap:2px;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:3px;z-index:100}
.lang-btn{background:transparent;border:none;color:#7d8590;font-size:11px;font-weight:600;letter-spacing:.5px;padding:5px 10px;border-radius:5px;cursor:pointer;transition:background .15s,color .15s}
.lang-btn:hover{color:#e6edf3}
.lang-btn.active{background:#7c3aed;color:#fff}

.top-nav{width:100%;max-width:720px;margin-bottom:24px}
.back-link{display:inline-flex;align-items:center;gap:6px;color:#7d8590;text-decoration:none;font-size:13px;font-weight:600;padding:6px 12px;border:1px solid #30363d;border-radius:6px;background:#161b22;transition:color .15s,background .15s,border-color .15s}
.back-link:hover{color:#e6edf3;background:#21262d;border-color:#484f58}

.hl-wrap{width:100%;max-width:720px}

.hl-head{margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid #21262d}
.hl-meta{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.hl-source{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:4px;color:#fff}
.badge-arxiv{background:#b31b1b}
.badge-hn{background:#ff6600}
.badge-reddit{background:#0079d3}
.badge-github{background:#21262d;color:#e6edf3;border:1px solid #30363d}
.badge-blogs{background:#14b8a6}
.hl-rank{font-size:11px;color:#fbbf24;font-weight:700;letter-spacing:.5px}
.hl-date{font-size:11px;color:#484f58;margin-left:auto}

.hl-title-ja{font-size:24px;font-weight:800;line-height:1.4;margin-bottom:8px;color:#e6edf3;letter-spacing:-.2px}
.hl-title-en{font-size:14px;color:#7d8590;font-weight:400;line-height:1.5;font-style:italic}

.hl-take{margin-top:18px;padding:14px 16px;background:linear-gradient(135deg,rgba(124,58,237,.08),rgba(168,85,247,.04));border-left:3px solid #fbbf24;border-radius:6px;font-size:14px;color:#c9d1d9;line-height:1.7}

.section{margin-bottom:32px}
.section-label{font-size:11px;font-weight:700;letter-spacing:1.2px;color:#7c3aed;text-transform:uppercase;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid #21262d;display:flex;align-items:center;gap:10px}
.section-label .lang-tag{margin-left:auto;font-size:10px;color:#484f58;font-weight:600;letter-spacing:.5px}

.lang-block{margin-bottom:18px}
.lang-block:last-child{margin-bottom:0}
.lang-block-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lang-pill{font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 8px;border-radius:10px;background:#21262d;color:#7d8590;border:1px solid #30363d}
.lang-pill.ja{color:#a855f7;border-color:rgba(168,85,247,.4)}
.lang-pill.en{color:#14b8a6;border-color:rgba(20,184,166,.4)}

.body-text{font-size:14.5px;line-height:1.85;color:#c9d1d9}

.key-points{list-style:none;display:flex;flex-direction:column;gap:8px}
.key-points li{position:relative;padding:8px 12px 8px 28px;background:#161b22;border:1px solid #21262d;border-radius:6px;font-size:13.5px;line-height:1.6;color:#c9d1d9}
.key-points li::before{content:"▸";position:absolute;left:10px;top:8px;color:#7c3aed;font-weight:700}

.source-box{background:linear-gradient(135deg,#1c1233 0%,#161b22 50%,#0d1117 100%);border:1px solid rgba(124,58,237,.4);border-radius:10px;padding:18px 20px}
.source-box-label{font-size:11px;color:#7d8590;margin-bottom:10px;font-weight:600;letter-spacing:.5px}
.source-link{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;text-decoration:none;padding:11px 18px;border-radius:8px;font-size:14px;font-weight:700;transition:filter .15s,box-shadow .15s}
.source-link:hover{filter:brightness(1.1);box-shadow:0 6px 20px rgba(124,58,237,.4)}
.source-extra{display:inline-flex;align-items:center;gap:8px;background:#21262d;color:#e6edf3;text-decoration:none;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:600;margin-left:10px;border:1px solid #30363d;transition:background .15s}
.source-extra:hover{background:#30363d}
.source-url{margin-top:12px;font-size:12px;color:#484f58;word-break:break-all;font-family:'SF Mono','Menlo',monospace}

.empty-state{text-align:center;padding:60px 20px;color:#484f58;font-size:15px}

footer{margin-top:48px;text-align:center;color:#484f58;font-size:11px;width:100%;max-width:720px}
footer a{color:#7d8590;text-decoration:none}
footer a:hover{color:#a855f7}

@media(max-width:600px){
  body{padding:24px 12px 60px}
  .hl-title-ja{font-size:20px}
  .body-text{font-size:14px}
  .source-extra{margin-left:0;margin-top:8px;display:inline-flex}
}
</style>
</head>
<body>

<div class="lang-switch">
  <button class="lang-btn active" data-lang="ja" onclick="setLang('ja')">JP</button>
  <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
</div>

<div class="top-nav">
  <a class="back-link" href="./" data-i18n="back">← AI News Daily に戻る</a>
</div>

<div class="hl-wrap" id="hlWrap">
  <div class="empty-state" id="emptyState" style="display:none" data-i18n="empty">ハイライトが見つかりません</div>
</div>

<footer>
  <p>
    <a href="./">AI News Daily</a> ·
    <a href="https://pndshch.github.io/">Pinda Lab</a> ·
    <a href="https://github.com/pndshch/ai-news-daily">GitHub</a>
  </p>
</footer>

<script>
const I18N = {
  ja: {
    back: "← AI News Daily に戻る",
    empty: "ハイライトが見つかりません",
    sectionWhat: "何の話？ / WHAT IS THIS?",
    sectionDetail: "詳しく / IN DETAIL",
    sectionKey: "キーポイント / KEY POINTS",
    sectionSource: "元情報 / SOURCE",
    sourceLabel: "原典で詳細を確認できます",
    sourceLink: "原文を読む →",
    pdfLink: "PDF",
    abstractLink: "arXiv",
    commentsLink: "コメント",
    repoLink: "リポジトリ",
    langJa: "日本語",
    langEn: "English",
  },
  en: {
    back: "← Back to AI News Daily",
    empty: "Highlight not found",
    sectionWhat: "WHAT IS THIS? / 何の話？",
    sectionDetail: "IN DETAIL / 詳しく",
    sectionKey: "KEY POINTS / キーポイント",
    sectionSource: "SOURCE / 元情報",
    sourceLabel: "Check the original for full context",
    sourceLink: "Read original →",
    pdfLink: "PDF",
    abstractLink: "arXiv",
    commentsLink: "Comments",
    repoLink: "Repo",
    langJa: "Japanese",
    langEn: "English",
  }
};

let currentLang = localStorage.getItem("pl-lang") || "ja";

const NEWS_DATA = /* __NEWS_DATA__ */ null;

function getParams() {
  const p = new URLSearchParams(window.location.search);
  return { date: p.get("d"), idx: parseInt(p.get("i"), 10) };
}

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem("pl-lang", lang);
  document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (I18N[lang][key]) el.textContent = I18N[lang][key];
  });
  render();
}

function escHtml(s) {
  if (!s) return "";
  const d = document.createElement("div"); d.textContent = s; return d.innerHTML;
}
function escAttr(s) { return (s||"").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

function getDateData(date) {
  if (!NEWS_DATA) return null;
  if (typeof NEWS_DATA === "object" && NEWS_DATA.date) return NEWS_DATA.date === date ? NEWS_DATA : null;
  if (Array.isArray(NEWS_DATA)) return NEWS_DATA.find(d => d.date === date) || null;
  return NEWS_DATA[date] || null;
}

function formatDate(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00Z");
  if (currentLang === "ja") {
    const days = ["日","月","火","水","木","金","土"];
    return `${d.getUTCFullYear()}年${d.getUTCMonth()+1}月${d.getUTCDate()}日（${days[d.getUTCDay()]}）`;
  }
  return d.toLocaleDateString("en-US", {weekday:"short", year:"numeric", month:"short", day:"numeric", timeZone:"UTC"});
}

function findExtraLinks(highlight, data) {
  if (!data || !data.sources) return [];
  const links = [];
  const url = highlight.url;
  const lookup = (arr, matchKey, urlKeys) => {
    if (!arr) return null;
    return arr.find(it => urlKeys.some(k => it[k] === url) || it.title === highlight.title);
  };
  if (highlight.source === "arxiv") {
    const p = lookup(data.sources.arxiv, "url", ["url"]);
    if (p && p.pdf_url) links.push({ label_key: "pdfLink", url: p.pdf_url });
  } else if (highlight.source === "reddit") {
    const p = lookup(data.sources.reddit, "url", ["comments_url","url"]);
    if (p) {
      if (p.url && p.url !== p.comments_url) links.push({ label_key: "sourceLink", url: p.url, raw_label: "Reddit link" });
      if (p.comments_url) links.push({ label_key: "commentsLink", url: p.comments_url });
    }
  } else if (highlight.source === "hn") {
    const p = lookup(data.sources.hn, "url", ["url","comments_url"]);
    if (p && p.comments_url && p.comments_url !== url) links.push({ label_key: "commentsLink", url: p.comments_url });
  }
  return links;
}

function render() {
  const wrap = document.getElementById("hlWrap");
  const { date, idx } = getParams();
  const data = getDateData(date);
  if (!data || !data.highlights || isNaN(idx) || !data.highlights[idx]) {
    wrap.innerHTML = `<div class="empty-state">${I18N[currentLang].empty}</div>`;
    document.title = "Highlight — AI News Daily";
    return;
  }
  const h = data.highlights[idx];
  const sourceLabel = {arxiv:"ARXIV",hn:"HN",reddit:"REDDIT",github:"GITHUB",blogs:"BLOG"}[h.source] || (h.source||"").toUpperCase();
  const titleJa = h.title_ja || h.title;
  const titleEn = h.title;
  const showOrig = h.title_ja && h.title_ja !== h.title;
  const take = (currentLang === "ja" && h.hot_take_ja) ? h.hot_take_ja : (h.hot_take_en || h.hot_take_ja || "");

  document.title = `${titleJa} — AI News Daily`;
  const ogt = document.querySelector('meta[property="og:title"]'); if (ogt) ogt.setAttribute("content", titleJa);
  const ogd = document.querySelector('meta[property="og:description"]'); if (ogd) ogd.setAttribute("content", h.hot_take_ja || h.detail_ja || titleJa);

  const detailJa = h.detail_ja || "";
  const detailEn = h.detail_en || "";
  const pointsJa = h.key_points_ja || [];
  const pointsEn = h.key_points_en || [];

  const extra = findExtraLinks(h, data);

  let html = "";
  html += `<div class="hl-head">`;
  html += `<div class="hl-meta">`;
  html += `<span class="hl-source badge-${h.source}">${sourceLabel}</span>`;
  html += `<span class="hl-rank">#${idx + 1}</span>`;
  html += `<span class="hl-date">${formatDate(date)}</span>`;
  html += `</div>`;
  html += `<div class="hl-title-ja">${escHtml(titleJa)}</div>`;
  if (showOrig) html += `<div class="hl-title-en">${escHtml(titleEn)}</div>`;
  if (take) html += `<div class="hl-take">${escHtml(take)}</div>`;
  html += `</div>`;

  if (detailJa || detailEn) {
    html += `<div class="section">`;
    html += `<div class="section-label">${I18N[currentLang].sectionDetail}</div>`;
    if (detailJa) {
      html += `<div class="lang-block">`;
      html += `<div class="lang-block-head"><span class="lang-pill ja">日本語</span></div>`;
      html += `<div class="body-text">${escHtml(detailJa)}</div>`;
      html += `</div>`;
    }
    if (detailEn) {
      html += `<div class="lang-block">`;
      html += `<div class="lang-block-head"><span class="lang-pill en">English</span></div>`;
      html += `<div class="body-text">${escHtml(detailEn)}</div>`;
      html += `</div>`;
    }
    html += `</div>`;
  }

  if (pointsJa.length || pointsEn.length) {
    html += `<div class="section">`;
    html += `<div class="section-label">${I18N[currentLang].sectionKey}</div>`;
    if (pointsJa.length) {
      html += `<div class="lang-block">`;
      html += `<div class="lang-block-head"><span class="lang-pill ja">日本語</span></div>`;
      html += `<ul class="key-points">${pointsJa.map(p => `<li>${escHtml(p)}</li>`).join("")}</ul>`;
      html += `</div>`;
    }
    if (pointsEn.length) {
      html += `<div class="lang-block">`;
      html += `<div class="lang-block-head"><span class="lang-pill en">English</span></div>`;
      html += `<ul class="key-points">${pointsEn.map(p => `<li>${escHtml(p)}</li>`).join("")}</ul>`;
      html += `</div>`;
    }
    html += `</div>`;
  }

  html += `<div class="section">`;
  html += `<div class="section-label">${I18N[currentLang].sectionSource}</div>`;
  html += `<div class="source-box">`;
  html += `<div class="source-box-label">${escHtml(I18N[currentLang].sourceLabel)}</div>`;
  html += `<a class="source-link" href="${escAttr(h.url)}" target="_blank" rel="noopener">${escHtml(I18N[currentLang].sourceLink)}</a>`;
  extra.forEach(l => {
    const label = l.raw_label || I18N[currentLang][l.label_key] || l.label_key;
    html += `<a class="source-extra" href="${escAttr(l.url)}" target="_blank" rel="noopener">${escHtml(label)}</a>`;
  });
  html += `<div class="source-url">${escHtml(h.url)}</div>`;
  html += `</div>`;
  html += `</div>`;

  wrap.innerHTML = html;
}

(function init() {
  setLang(currentLang);
  render();
})();
</script>
</body>
</html>
